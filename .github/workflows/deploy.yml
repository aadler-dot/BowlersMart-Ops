name: Sync Ares Revenue to GitHub Pages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync_revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch revenue from Ares API
        env:
          ARES_API_KEY: ${{ secrets.ARES_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, datetime, os, time, ssl

          API_KEY  = os.environ['ARES_API_KEY']
          BASE_URL = 'https://ares.bowlersmart.com/pos/api/v1'

          # Skip SSL verification (same as curl -k)
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          BRANCHES = {
            48: 'BowlersMart Altamonte',
            2:  'Bowlersmart Apopka',
            83: 'BowlersMart Baton Rouge',
            4:  'BowlersMart Brook Park',
            6:  'Bowlersmart Canton',
            8:  'BowlersMart Charlotte',
            86: 'BowlersMart Columbus',
            76: 'BowlersMart Crystal River',
            78: 'BowlersMart Dayton',
            50: 'BowlersMart Deltona',
            95: 'BowlersMart Dunedin',
            75: 'BowlersMart Fiesta',
            14: 'Bowlersmart Henderson',
            56: 'BowlersMart IQ',
            16: 'Bowlersmart Jacksonville',
            46: 'Bowlersmart Johnsburg',
            17: 'BowlersMart Lake Zurich',
            18: 'Bowlersmart Lakeland',
            20: 'BowlersMart Las Vegas',
            49: 'BowlersMart Leesburg',
            21: 'Bowlersmart Melbourne',
            22: 'BowlersMart Merritt Island',
            23: 'Bowlersmart Milwaukee',
            85: 'BowlersMart Morgantown',
            80: 'BowlersMart New Port Richey',
            26: 'BowlersMart Oak Lawn',
            66: 'BowlersMart Oakwood',
            96: 'BowlersMart Ocala',
            27: 'Bowlersmart Orlando',
            28: 'BowlersMart Palm Bay',
            84: 'BowlersMart Parkersburg',
            29: 'BowlersMart Pleasant Valley',
            53: 'BowlersMart Plum Hollow',
            82: 'BowlersMart Port Richey',
            30: 'BowlersMart Rockford Carters',
            31: 'BowlersMart Rockford Cherry Valley',
            81: 'BowlersMart Roseville',
            87: 'BowlersMart Rossford',
            32: 'Bowlersmart Sanford',
            33: 'BowlersMart Santa Fe Station',
            64: 'BowlersMart South Beloit',
            74: 'BowlersMart Spanish Springs',
            34: 'Bowlersmart Spring Hill',
            35: 'Bowlersmart Tampa',
            52: 'BowlersMart Tampa University',
            55: 'Bowlersmart Taylor',
            70: 'BowlersMart Tinley Park',
            39: 'BowlersMart Warner Robins',
            88: 'BowlersMart Washington',
            41: 'BowlersMart Winter Park',
            42: 'Bowlersmart Woodridge',
          }

          def ares_get(path, params={}):
            url = BASE_URL + path
            if params:
              url += '?' + urllib.parse.urlencode(params)
            req = urllib.request.Request(
              url,
              headers={'Authorization': f'Bearer {API_KEY}', 'Accept': 'application/json'}
            )
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req, timeout=60, context=ctx) as res:
                  return json.loads(res.read())
              except Exception as e:
                print(f'  Attempt {attempt+1} failed: {e}')
                if attempt < 2:
                  time.sleep(2)
            return None

          import calendar

          def fetch_month_revenue(year, month):
            date_from = f'{year}-{month:02d}-01'
            last_day  = calendar.monthrange(year, month)[1]
            date_to   = f'{year}-{month:02d}-{last_day}'

            totals = {}
            cursor = None
            page   = 0
            total_invoices = 0

            print(f'  Fetching {date_from} to {date_to}...')

            while True:
              params = {'dateFrom': date_from, 'dateTo': date_to, 'limit': 1000}
              if cursor:
                params['cursor'] = cursor

              data = ares_get('/analytics/sales-per-branch/detail', params)

              if not data or not data.get('success'):
                print(f'  !! API error on page {page}')
                break

              rows      = data.get('data', {}).get('rows', [])
              page_info = data.get('data', {}).get('pageInfo', {})

              for row in rows:
                bid   = row.get('BranchId')
                total = float(row.get('Total', 0) or 0)
                if bid is not None:
                  totals[bid] = totals.get(bid, 0) + total

              total_invoices += len(rows)
              page += 1
              print(f'  Page {page}: {len(rows)} invoices (total so far: {total_invoices})')

              if not page_info.get('hasMore', False):
                print(f'  Done — {total_invoices} invoices across {page} pages')
                break

              cursor = page_info.get('nextCursor')
              if not cursor:
                print(f'  No cursor returned, stopping')
                break

              # Small delay to avoid rate limiting
              time.sleep(0.5)

            return totals

          now = datetime.datetime.utcnow()
          current_year  = now.year
          current_month = now.month

          month_names = ['Jan','Feb','Mar','Apr','May','Jun',
                         'Jul','Aug','Sep','Oct','Nov','Dec']

          revenue = {}
          for store in BRANCHES.values():
            revenue[store] = {m: 0 for m in month_names}
            revenue[store]['ytd'] = 0
            revenue[store]['mtd'] = 0

          print(f'Fetching Jan–{month_names[current_month-1]} {current_year} for {len(BRANCHES)} stores\n')

          for month in range(1, current_month + 1):
            month_name = month_names[month - 1]
            print(f'=== {month_name} {current_year} ===')
            totals = fetch_month_revenue(current_year, month)

            matched = 0
            for bid, total in totals.items():
              store = BRANCHES.get(bid)
              if store:
                revenue[store][month_name]  = round(total, 2)
                revenue[store]['ytd']      += total
                if month == current_month:
                  revenue[store]['mtd'] = round(total, 2)
                matched += 1

            print(f'  Matched {matched}/{len(totals)} branches\n')

          # Round YTD totals
          for store in revenue:
            revenue[store]['ytd'] = round(revenue[store]['ytd'], 2)

          output = {
            'generated':    datetime.datetime.utcnow().isoformat() + 'Z',
            'year':         current_year,
            'currentMonth': current_month,
            'monthNames':   month_names[:current_month],
            'stores':       revenue,
            'totalYTD':     round(sum(v['ytd'] for v in revenue.values()), 2),
            'totalMTD':     round(sum(v['mtd'] for v in revenue.values()), 2),
          }

          with open('revenue.json', 'w') as f:
            json.dump(output, f, indent=2)

          print(f'revenue.json written')
          print(f'Chain YTD: ${output["totalYTD"]:,.2f}')
          print(f'Chain MTD: ${output["totalMTD"]:,.2f}')
          print(f'Stores with Apr data: {sum(1 for v in revenue.values() if v["Apr"] > 0)}')
          print(f'Stores with Jun data: {sum(1 for v in revenue.values() if v["Jun"] > 0)}')
          PYEOF

      - name: Inject API key into HTML
        run: |
          sed -i 's|__ARES_API_KEY__|${{ secrets.ARES_API_KEY }}|g' index.html

      - name: Commit revenue.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add revenue.json
          git diff --staged --quiet || git commit -m "chore: update revenue data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
