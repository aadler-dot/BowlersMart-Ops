name: Sync Ares Revenue to GitHub Pages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Must match deploy.yml's group so the two never deploy Pages at the same time.
# Without this, a manual push (deploy.yml) racing the nightly sync produces:
#   "Deployment request failed ... due to in progress deployment"
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync_revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Default is a shallow clone (depth 1); `git pull --rebase` against a
          # shallow history fails with exit 128. Full history is required here.
          fetch-depth: 0

      - name: Fetch revenue and profit from Ares API
        env:
          ARES_API_KEY: ${{ secrets.ARES_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, datetime, os, time, ssl, calendar

          API_KEY  = os.environ['ARES_API_KEY']
          BASE_URL = 'https://ares.bowlersmart.com/pos/api/v1'

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          BRANCHES = {
            48: 'BowlersMart Altamonte',    2: 'Bowlersmart Apopka',
            83: 'BowlersMart Baton Rouge',   4: 'BowlersMart Brook Park',
             6: 'Bowlersmart Canton',         8: 'BowlersMart Charlotte',
            86: 'BowlersMart Columbus',      76: 'BowlersMart Crystal River',
            78: 'BowlersMart Dayton',        50: 'BowlersMart Deltona',
            95: 'BowlersMart Dunedin',       75: 'BowlersMart Fiesta',
            14: 'Bowlersmart Henderson',     56: 'BowlersMart IQ',
            16: 'Bowlersmart Jacksonville',  46: 'Bowlersmart Johnsburg',
            17: 'BowlersMart Lake Zurich',   18: 'Bowlersmart Lakeland',
            20: 'BowlersMart Las Vegas',     49: 'BowlersMart Leesburg',
            21: 'Bowlersmart Melbourne',     22: 'BowlersMart Merritt Island',
            23: 'Bowlersmart Milwaukee',     85: 'BowlersMart Morgantown',
            80: 'BowlersMart New Port Richey', 26: 'BowlersMart Oak Lawn',
            66: 'BowlersMart Oakwood',       96: 'BowlersMart Ocala',
            27: 'Bowlersmart Orlando',       28: 'BowlersMart Palm Bay',
            84: 'BowlersMart Parkersburg',   29: 'BowlersMart Pleasant Valley',
            53: 'BowlersMart Plum Hollow',   82: 'BowlersMart Port Richey',
            30: 'BowlersMart Rockford Carters', 31: 'BowlersMart Rockford Cherry Valley',
            81: 'BowlersMart Roseville',     87: 'BowlersMart Rossford',
            32: 'Bowlersmart Sanford',       33: 'BowlersMart Santa Fe Station',
            64: 'BowlersMart South Beloit',  74: 'BowlersMart Spanish Springs',
            34: 'Bowlersmart Spring Hill',   35: 'Bowlersmart Tampa',
            52: 'BowlersMart Tampa University', 55: 'Bowlersmart Taylor',
            70: 'BowlersMart Tinley Park',   39: 'BowlersMart Warner Robins',
            88: 'BowlersMart Washington',    41: 'BowlersMart Winter Park',
            42: 'Bowlersmart Woodridge',
          }

          def ares_get(path, params={}):
            url = BASE_URL + path
            if params:
              url += '?' + urllib.parse.urlencode(params)
            req = urllib.request.Request(
              url,
              headers={'Authorization': f'Bearer {API_KEY}', 'Accept': 'application/json'}
            )
            wait = 10
            for attempt in range(5):
              try:
                with urllib.request.urlopen(req, timeout=60, context=ctx) as res:
                  return json.loads(res.read())
              except urllib.error.HTTPError as e:
                if e.code == 429:
                  print(f'  Rate limited — waiting {wait}s...')
                  time.sleep(wait)
                  wait *= 2
                else:
                  print(f'  HTTP {e.code} on attempt {attempt+1}')
                  time.sleep(3)
              except Exception as e:
                print(f'  Error on attempt {attempt+1}: {e}')
                time.sleep(3)
            return None

          def fetch_month_revenue(year, month):
            date_from = f'{year}-{month:02d}-01'
            last_day  = calendar.monthrange(year, month)[1]
            date_to   = f'{year}-{month:02d}-{last_day}'
            totals = {}
            cursor = None
            page   = 0
            total_invoices = 0
            print(f'  Fetching {date_from} to {date_to}...')
            while True:
              params = {'dateFrom': date_from, 'dateTo': date_to, 'limit': 1000}
              if cursor:
                params['cursor'] = cursor
              data = ares_get('/analytics/sales-per-branch/detail', params)
              if not data or not data.get('success'):
                print(f'  !! Failed on page {page}')
                break
              rows      = data.get('data', {}).get('rows', [])
              page_info = data.get('data', {}).get('pageInfo', {})
              for row in rows:
                bid   = row.get('BranchId')
                total = float(row.get('Total', 0) or 0)
                tax   = float(row.get('Tax',   0) or 0)
                pretax = total - tax  # pre-tax revenue
                if bid is not None:
                  totals[bid] = totals.get(bid, 0) + pretax
              total_invoices += len(rows)
              page += 1
              print(f'  Page {page}: {len(rows)} invoices (total: {total_invoices})')
              if not page_info.get('hasMore', False):
                print(f'  Complete — {total_invoices} invoices')
                break
              cursor = page_info.get('nextCursor')
              if not cursor:
                break
              time.sleep(3)
            return totals

          now = datetime.datetime.utcnow()
          current_year  = now.year
          current_month = now.month
          month_names   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

          # ── REVENUE ─────────────────────────────────────────────────────────
          revenue = {}
          for store in BRANCHES.values():
            revenue[store] = {m: 0 for m in month_names}
            revenue[store]['ytd'] = 0
            revenue[store]['mtd'] = 0

          print(f'Fetching revenue Jan–{month_names[current_month-1]} {current_year}\n')
          for month in range(1, current_month + 1):
            month_name = month_names[month - 1]
            print(f'=== {month_name} {current_year} ===')
            totals = fetch_month_revenue(current_year, month)
            matched = 0
            for bid, total in totals.items():
              store = BRANCHES.get(bid)
              if store:
                revenue[store][month_name]  = round(total, 2)
                revenue[store]['ytd']      += total
                if month == current_month:
                  revenue[store]['mtd'] = round(total, 2)
                matched += 1
            print(f'  Matched {matched} stores\n')
            if month < current_month:
              print('  Pausing 5s...')
              time.sleep(5)

          for store in revenue:
            revenue[store]['ytd'] = round(revenue[store]['ytd'], 2)

          # ── PROFIT ──────────────────────────────────────────────────────────
          print('\nFetching profit summary...')
          ytd_start = f'{current_year}-01-01'
          today     = now.strftime('%Y-%m-%d')

          profit = {}
          for store in BRANCHES.values():
            profit[store] = {
              'ytd_profit': 0, 'ytd_margin': 0,
              'mtd_profit': 0, 'mtd_margin': 0,
              'months': {}
            }

          profit_data = ares_get('/profit/summary', {'dateFrom': ytd_start, 'dateTo': today})

          if profit_data and profit_data.get('success'):
            stores_list = profit_data.get('data', {}).get('stores', [])
            matched = 0
            for s in stores_list:
              bid  = s.get('BranchId')
              name = BRANCHES.get(bid)
              if not name:
                continue  # skip Warehouse and unknown branches
              t = s.get('totals', {})
              profit[name]['ytd_profit'] = round(t.get('totalProfit', 0), 2)
              profit[name]['ytd_margin'] = round(t.get('margin', 0), 2)
              # Monthly breakdown
              for m in s.get('months', []):
                month_key = m.get('month', '')  # e.g. "2026-01"
                if month_key:
                  mn = month_names[int(month_key.split('-')[1]) - 1]
                  profit[name]['months'][mn] = {
                    'profit': round(m.get('totalProfit', 0), 2),
                    'margin': round(m.get('margin', 0), 2),
                    'sales':  round(m.get('totalSales', 0), 2),
                  }
              # MTD = current month's profit
              cur_month_key = f'{current_year}-{current_month:02d}'
              cur_mn = month_names[current_month - 1]
              for m in s.get('months', []):
                if m.get('month') == cur_month_key:
                  profit[name]['mtd_profit'] = round(m.get('totalProfit', 0), 2)
                  profit[name]['mtd_margin'] = round(m.get('margin', 0), 2)
              matched += 1
            print(f'Profit: matched {matched} stores')
          else:
            print('Profit fetch failed — skipping')

          # ── BUILD OUTPUT ────────────────────────────────────────────────────
          output = {
            'generated':    datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'year':         current_year,
            'currentMonth': current_month,
            'monthNames':   month_names[:current_month],
            'stores':       revenue,
            'profit':       profit,
            'totalYTD':     round(sum(v['ytd'] for v in revenue.values()), 2),
            'totalMTD':     round(sum(v['mtd'] for v in revenue.values()), 2),
            'totalProfit':  round(sum(v['ytd_profit'] for v in profit.values()), 2),
            'avgMargin':    round(
              sum(v['ytd_margin'] for v in profit.values() if v['ytd_margin'] > 0) /
              max(1, sum(1 for v in profit.values() if v['ytd_margin'] > 0)), 2
            ),
          }

          with open('revenue.json', 'w') as f:
            json.dump(output, f, indent=2)

          print(f'\nrevenue.json written')
          print(f'Chain YTD Revenue: ${output["totalYTD"]:,.2f}')
          print(f'Chain YTD Profit:  ${output["totalProfit"]:,.2f}')
          print(f'Avg Margin:        {output["avgMargin"]}%')
          for m in month_names[:current_month]:
            has = sum(1 for v in revenue.values() if v.get(m, 0) > 0)
            print(f'  {m}: {has}/51 stores')
          PYEOF

      - name: Inject API key into HTML
        run: |
          sed -i 's|__ARES_API_KEY__|${{ secrets.ARES_API_KEY }}|g' index.html


      - name: Build cycle-counts.json from Ares
        env:
          ARES_INVENTORY_KEY: ${{ secrets.ARES_INVENTORY_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $ARES_INVENTORY_KEY" \
            "https://ares.bowlersmart.com/pos/api/v1/inventory/physical-counts/weekly" \
            -o /tmp/pc.json
          python3 << 'PYEOF'
          import json, datetime, os, collections

          EXCLUDE_IDS   = {1, 44, 103}        # Warehouse, Head Office, HQ
          EXCLUDE_NAMES = ('HQ', 'Warehouse', 'Head Office')
          OUT = 'cycle-counts.json'

          raw = json.load(open('/tmp/pc.json'))
          if not raw.get('success'):
              print('::warning::API success=false; leaving', OUT, 'untouched')
              raise SystemExit(0)
          data  = raw['data']
          cells = data.get('cells', [])
          branches = [b for b in data.get('branches', [])
                      if b['branchId'] not in EXCLUDE_IDS
                      and not any(x in b['branchName'] for x in EXCLUDE_NAMES)]

          def thu_week(ts):
              d = datetime.datetime.strptime(ts, '%Y-%m-%d %H:%M:%S').date()
              st = d - datetime.timedelta(days=(d.weekday() - 3) % 7)
              en = st + datetime.timedelta(days=6)
              return '%d/%d-%d/%d' % (st.month, st.day, en.month, en.day)

          def wk_key(w):
              m, d = w.split('-')[0].split('/')
              return datetime.date(2026, int(m), int(d))

          # ---------- diagnostics ----------
          print('statuses:', dict(collections.Counter(c.get('status', '?') for c in cells)))
          dates = sorted(c['date'] for c in cells if c.get('date'))
          if dates:
              print('data range: %s .. %s' % (dates[0], dates[-1]))
          matrix = collections.defaultdict(collections.Counter)
          for c in cells:
              if c.get('date'):
                  matrix[thu_week(c['date'])][c.get('cycleGroup', '?')] += 1
          print('\nweek -> cycleGroup (this is the rotation):')
          for w in sorted(matrix, key=wk_key):
              for g, n in matrix[w].most_common():
                  print('   %-14s %-40s %d' % (w, g, n))

          # ---------- build grid: every store, even with zero counts ----------
          stores = {b['branchName']: {} for b in branches}
          names  = {b['branchId']: b['branchName'] for b in branches}
          for c in cells:
              name = names.get(c.get('branchId'))
              if not name or not c.get('date'):
                  continue
              wk  = thu_week(c['date'])
              rec = stores[name]
              prev = rec.get(wk)
              if prev is None or c['date'] < prev['date']:
                  rec[wk] = {
                      'done':      c.get('status') == 'Done',
                      'status':    c.get('status'),
                      'group':     c.get('cycleGroup'),
                      'date':      c['date'],
                      'dollarNet': c.get('dollarNet'),
                  }

          weeks = sorted(matrix, key=wk_key)
          payload = {
              'generated':  datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source':     'ares:/inventory/physical-counts/weekly',
              'cycleWeeks': weeks,
              'stores':     stores,
          }

          if os.path.exists(OUT):
              try:
                  old = json.load(open(OUT))
                  for name, wk in old.get('stores', {}).items():
                      merged = dict(wk)
                      merged.update(stores.get(name, {}))
                      payload['stores'][name] = merged
                  weeks = sorted(set(old.get('cycleWeeks', [])) | set(weeks), key=wk_key)
                  payload['cycleWeeks'] = weeks
              except Exception as e:
                  print('::warning::merge failed: %s' % e)

          json.dump(payload, open(OUT, 'w'), indent=1)

          done    = sum(1 for r in payload['stores'].values() for v in r.values() if v['done'])
          pending = sum(1 for r in payload['stores'].values() for v in r.values() if v.get('status') == 'Pending')
          denied  = sum(1 for r in payload['stores'].values() for v in r.values() if v.get('status') == 'Denied')
          slots   = len(payload['stores']) * len(weeks)
          print('\nstores: %d (all branches, incl. zero-count) | weeks: %d' % (len(payload['stores']), len(weeks)))
          print('done %d | pending %d | denied %d | %d slots -> %.1f%%'
                % (done, pending, denied, slots, (done / slots * 100) if slots else 0))
          zero = [n for n, r in payload['stores'].items() if not any(v['done'] for v in r.values())]
          print('stores with zero completions (%d): %s' % (len(zero), ', '.join(sorted(zero)[:12])))
          PYEOF

      - name: Commit revenue.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add revenue.json cycle-counts.json

          if git diff --staged --quiet; then
            echo "revenue.json unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "chore: update revenue + cycle count data $(date -u '+%Y-%m-%d %H:%M') UTC"

          # revenue.json is fully regenerated each run, so on a race our copy wins.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main."
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              git checkout --ours revenue.json || true
              git add revenue.json cycle-counts.json || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
          done

          echo "::error::Could not push revenue.json after 3 attempts."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
