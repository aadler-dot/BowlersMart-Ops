name: Publish Logo to Pages

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode logo to PNG at repo root
        working-directory: automation
        run: |
          node -e "const fs=require('fs'); const b64=require('./lib/logo-base64.js'); fs.writeFileSync('../bmart-logo.png', Buffer.from(b64, 'base64'));"

      - name: Commit logo file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bmart-logo.png
          git commit -m "Add BowlersMart logo PNG for hosted email use" || echo "Nothing to commit"
          git push
