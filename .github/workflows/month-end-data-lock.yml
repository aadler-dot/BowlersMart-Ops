name: Month-End Data Lock

on:
  schedule:
    # Runs daily; is-month-end.js gates the heavy job so it only actually
    # does anything on the last day of the month.
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run the data lock right now regardless of date (for testing)'
        type: boolean
        default: false
      only_store:
        description: 'Only generate/lock this one store (for testing)'
        type: string
        default: ''
      report_month:
        description: 'Month to snapshot as YYYY-MM (e.g. 2026-08). Leave blank to use the month today falls in.'
        type: string
        default: ''

jobs:
  check-month-end:
    runs-on: ubuntu-latest
    outputs:
      is_month_end: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Check if today is month-end
        id: check
        working-directory: automation
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          if node is-month-end.js; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  lock-data:
    needs: check-month-end
    if: needs.check-month-end.outputs.is_month_end == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (with Playwright browser)
        working-directory: automation
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Compute locked folder name
        id: folder
        working-directory: automation
        env:
          REPORT_MONTH: ${{ inputs.report_month }}
        run: |
          # On its normal schedule this runs on the last day of the month it is
          # snapshotting, so "today's month" is the right answer. Run it any other
          # day and that silently produces the WRONG month -- e.g. dispatched on
          # 11 Sep it would lock September (11 days of revenue) and label it Sep,
          # while the send workflow looks for August. report_month makes a
          # late/backfill run possible.
          if [ -n "$REPORT_MONTH" ]; then
            if ! printf '%s' "$REPORT_MONTH" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
              echo "report_month must look like YYYY-MM (got '$REPORT_MONTH')"
              exit 1
            fi
            FOLDER="$REPORT_MONTH"
            YEAR="${REPORT_MONTH%%-*}"
            MONTH="${REPORT_MONTH##*-}"
            MONTH_IDX=$((10#$MONTH - 1))
          else
            FOLDER=$(node locked-folder-name.js current)
            MONTH_IDX=$(( $(date +%-m) - 1 ))
            YEAR=$(date +%Y)
          fi
          echo "Locking $FOLDER (month index $MONTH_IDX, year $YEAR)"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "month_idx=$MONTH_IDX" >> "$GITHUB_OUTPUT"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"

      - name: Generate reports
        working-directory: automation
        env:
          OUTPUT_DIR: locked/${{ steps.folder.outputs.folder }}
          LAST_COMPLETE_MONTH_IDX: ${{ steps.folder.outputs.month_idx }}
          REPORT_YEAR: ${{ steps.folder.outputs.year }}
          ONLY_STORE: ${{ inputs.only_store }}
        run: node generate-reports.js

      - name: Commit locked snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/locked/${{ steps.folder.outputs.folder }}
          git commit -m "Lock ${{ steps.folder.outputs.folder }} store performance data" || echo "Nothing to commit"
          git push
